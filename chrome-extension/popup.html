<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Portal Session Exporter</title>
    <style>
        body {
            width: 350px;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            text-align: center;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #667eea;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }
        .info {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.9;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h2>🔐 Session Exporter</h2>
    <p style="font-size: 13px; text-align: center;">Export cookies from current tab</p>
    
    <button class="btn" id="exportBtn">📥 Export Cookies</button>
    
    <div class="status" id="status"></div>
    
    <div class="info">
        <strong>How to use:</strong><br>
        1. Navigate to the website you want to export sessions from<br>
        2. Click this extension icon<br>
        3. Click "Export Cookies"<br>
        4. Upload the downloaded JSON file to Cloud Portal Proxy
    </div>

    <script src="popup.js"></script>
</body>
</html>
